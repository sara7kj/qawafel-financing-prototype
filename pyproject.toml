[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financing"
version = "0.1.0"
description = "Synthetic SME financing package prototype (Qawafel Graduate SE assessment)"
requires-python = ">=3.13"
# Pinned runtime environment lives in requirements.txt.
dependencies = ["openpyxl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
